{% set name = "pyzstd" %}
{% set version = "0.19.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 36723d3c915b3981de9198d0a2c82b2f5fe3eaa36e4d8d586937830a8afc7d72

build:
  number: 0
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation -vv .

requirements:
  host:
    - python
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python
    - backports.zstd >=1.0.0
    - typing-extensions >=4.13.2

test:
  source_files:
    - tests/
  requires:
    - pip
  imports:
    - pyzstd
  commands:
    - python -m unittest -v
    - pip check

about:
  home: https://github.com/Rogdham/pyzstd
  doc_url: https://pyzstd.readthedocs.io
  dev_url: https://github.com/Rogdham/pyzstd
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Support for Zstandard (zstd) compression
  description: |
    Pyzstd module provides classes and functions for compressing and decompressing data, using Facebook's Zstandard (or zstd as short name) algorithm. The API style is similar to Python's bz2/lzma/zlib modules.

extra:
  recipe-maintainers:
    - animalize
    - rogdham
